name: Build editor APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log

      # Gradle's stack trace buries the compiler output; repeat just the errors at the end.
      - name: Compiler errors
        if: failure()
        shell: bash
        run: |
          echo "--- Kotlin/Java errors ---"
          grep -E "^(e:|error:)" build.log | head -80 || echo "(none found)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockforge2d-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
