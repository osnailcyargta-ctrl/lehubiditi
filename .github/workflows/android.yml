name: Build editor APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log

      # Gradle's stack trace buries the compiler output; repeat just the errors at the end.
      # `shell: bash` runs with pipefail, so a `|| echo none` fallback here would swallow real
      # output whenever grep exits non-zero. Print unconditionally instead.
      - name: Compiler errors
        if: failure()
        shell: bash
        run: |
          echo "--- Kotlin/Java errors ---"
          grep -E "^(e:|error:)" build.log | head -80 || true
          echo "--- gradle output (tail) ---"
          tail -n 60 build.log || true

      - name: Upload editor APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockforge2d-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Proves the headline feature: a project produced by the exporter really does build into an APK.
  exported-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate a sample exported project
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee generate.log; then
            echo "=== gradle output (tail) ==="
            tail -n 80 generate.log
            echo "=== unit test results ==="
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              echo "--- $f"
              head -c 4000 "$f"
              echo
            done
            exit 1
          fi

      - name: Build the exported project
        shell: bash
        working-directory: app/build/exported-sample
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew assembleDebug --console=plain 2>&1 | tee build.log; then
            echo "=== compiler errors in the exported project ==="
            grep -E "^(e:|error:)" build.log | head -60 || true
            echo "=== gradle output (tail) ==="
            tail -n 80 build.log
            exit 1
          fi
          ls -la app/build/outputs/apk/debug/

      # A failure here can be a compiler error, a failed assertion, or Gradle refusing to start,
      # so show all three rather than grepping for one of them.
      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::compiler errors"
          grep -hE "^(e:|error:)" generate.log app/build/exported-sample/build.log 2>/dev/null | head -60 || true
          echo "::endgroup::"

          echo "::group::unit test failures"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            echo "--- $f"
            sed -n 's/.*<failure message="\([^"]*\)".*/FAILURE: \1/p' "$f" | head -20
            sed -n '/<failure/,/<\/failure>/p' "$f" | head -40
          done
          echo "::endgroup::"

          echo "::group::tail of generate.log"
          tail -n 60 generate.log 2>/dev/null || echo "(no generate.log)"
          echo "::endgroup::"

          echo "::group::tail of exported build.log"
          tail -n 60 app/build/exported-sample/build.log 2>/dev/null || echo "(no build.log)"
          echo "::endgroup::"

          echo "::group::exported project tree"
          find app/build/exported-sample -maxdepth 4 -not -path '*/.gradle/*' 2>/dev/null | head -60 || true
          echo "::endgroup::"

      - name: Upload exported game APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exported-game-debug-apk
          path: app/build/exported-sample/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
